site_name: tlacraftpy
site_description: Pythonで記述するTLA+仕様とTLCによるモデル検査
site_url: https://eldesh.github.io/tlacraftpy/
repo_url: https://github.com/eldesh/tlacraftpy
repo_name: eldesh/tlacraftpy
edit_uri: edit/master/docs/
strict: true

theme:
  name: mkdocs
  locale: ja
  color_mode: auto
  user_color_mode_toggle: true

plugins:
  - search:
      lang: ja

markdown_extensions:
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - fenced_code
  - tables

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - 概要: index.md
  - チュートリアル: tutorial.md
  - 利用ガイド: usage.md
  - 言語リファレンス: language.md
  - FIFOモデル: fifo.md
  - 開発者向け:
      - 開発手順: development.md
      - パッケージの配布: distribution.md
